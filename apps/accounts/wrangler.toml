# accounts.martingawlakcompany.com: one login for every brand.
# Secrets (wrangler secret put NAME):
#   BETTER_AUTH_SECRET   random 32+ bytes (openssl rand -base64 32)
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET   optional, enables Google
#   APPLE_CLIENT_ID / APPLE_CLIENT_SECRET / APPLE_APP_BUNDLE_IDENTIFIER   optional, enables Apple
#   PRIVY_APP_ID                              optional, enables Privy (PRIVY_VERIFICATION_KEY optionally pins one key)
name = "accounts"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# Served at accounts.martingawlakcompany.com (custom domain attached in Cloudflare,
# 2026-11-25). The workers.dev address stays on as a fallback.
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/sign-out", "/.well-known/*", "/panel.js"]

# The shared account panel (src/panel) is bundled into the Worker as text.
[[rules]]
type = "Text"
globs = ["**/panel/panel.js", "**/panel/panel.css"]
fallthrough = false

[vars]
BETTER_AUTH_URL = "https://accounts.martingawlakcompany.com"
ADMIN_EMAILS = "hello@martingawlakcompany.com"
EMAIL_FROM_ADDRESS = "accounts@martingawlakcompany.com"
EMAIL_FROM_NAME = "Martin Gawlak Company"
CONTACT_TO = "hello@martingawlakcompany.com"
# Privy app "MGC Privy" (public: it is also in every sign-in page).
PRIVY_APP_ID = "cmrz8ctm200g10clcgzxspy6b"

# Cloudflare Email Sending: sign-in codes and website contact messages.
# One-time: npx wrangler email sending enable martingawlakcompany.com
[[send_email]]
name = "EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "mgc-accounts"
database_id = "7019cf49-2ff3-4f59-a5e2-ad4a4a562ddf"
migrations_dir = "migrations"
