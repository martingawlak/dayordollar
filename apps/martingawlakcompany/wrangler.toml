# Cloudflare Pages project for martingawlakcompany.com.
# Secrets (set in the Cloudflare dashboard or with `wrangler pages secret put`):
#   STRIPE_SECRET_KEY, SSO_CLIENT_SECRET, SESSION_SECRET, RESEND_API_KEY
name = "martingawlakcompany"
