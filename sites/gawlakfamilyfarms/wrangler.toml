# gawlakfamilyfarms.com without WordPress. Secrets (wrangler secret put NAME):
#   SSO_CLIENT_SECRET, SESSION_SECRET, GOOGLE_GEOCODE_KEY, RESEND_API_KEY,
#   GDRIVE_SA_JSON (GFF Drive Backup's service-account JSON: wrangler secret put GDRIVE_SA_JSON < key.json)
#   STRIPE_SECRET_KEY (the shop's restricted key; MIGRATION.md lists its permissions),
#   STRIPE_WEBHOOK_SECRET (the whsec_… of the endpoint https://gawlakfamilyfarms.com/shop/stripe-webhook)
name = "gawlakfamilyfarms"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
SSO_ISSUER = "https://accounts.martingawlakcompany.com/api/auth"
SSO_CLIENT_ID = "gawlakfamilyfarms"
SITE_ORIGIN = "https://gawlakfamilyfarms.com"

# The site's theme files and images are served first; everything else reaches the Worker.
[assets]
directory = "./public"

# The plugins' daily WP-Cron jobs (src/jobs/index.ts CRON_HOOKS says which trigger runs which):
#   17 9 * * *  gff_v33_cron         the recurring invoice cycle
#   1 4 * * *   gff_dbk_daily_event  GFF Drive Backup, 12:01 AM site time (gmt_offset -4 = 04:01 UTC)
[triggers]
crons = ["17 9 * * *", "1 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "gawlakfamilyfarms"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"
