# gawlakfamilyfarms.com without WordPress. Secrets (wrangler secret put NAME):
#   SSO_CLIENT_SECRET, SESSION_SECRET, GOOGLE_GEOCODE_KEY, RESEND_API_KEY,
#   GDRIVE_SA_JSON (GFF Drive Backup's service-account JSON: wrangler secret put GDRIVE_SA_JSON < key.json)
#   STRIPE_SECRET_KEY (the shop's restricted key; MIGRATION.md lists its permissions),
#   STRIPE_WEBHOOK_SECRET (the whsec_… of the endpoint https://gawlakfamilyfarms.com/shop/stripe-webhook)
name = "gawlakfamilyfarms"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
SSO_ISSUER = "https://accounts.martingawlakcompany.com/api/auth"
SSO_CLIENT_ID = "qlwXUcTyaZLJBJUCbhUMYQdlGBZSUEcE"
SITE_ORIGIN = "https://gawlakfamilyfarms.com"
# The live site's WP Mail SMTP forced this sender for every message; kept.
EMAIL_FROM_ADDRESS = "hello@martingawlakcompany.com"
EMAIL_FROM_NAME = "Martin Gawlak Company"

# Mail (invoices, sign-up and account notices) goes out through Cloudflare Email
# Sending, from martingawlakcompany.com (already onboarded for the accounts service).
[[send_email]]
name = "EMAIL"

# The site's theme files and images are served first; everything else reaches the Worker.
[assets]
directory = "./public"

# The plugins' daily WP-Cron jobs (src/jobs/index.ts CRON_HOOKS says which trigger runs which):
#   17 9 * * *  gff_v33_cron         the recurring invoice cycle
#   1 4 * * *   gff_dbk_daily_event  GFF Drive Backup, 12:01 AM site time (gmt_offset -4 = 04:01 UTC)
[triggers]
crons = ["17 9 * * *", "1 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "gawlakfamilyfarms"
database_id = "c41ec0a1-3c51-4226-bd38-6a30a8320008"
migrations_dir = "migrations"

# A private preview (wrangler deploy --env preview) on workers.dev, beside the
# live WordPress site: the same database, no scheduled jobs (WordPress still
# sends the invoices and the backup until cutover), links to the preview
# address, sign-in off (the accounts service only knows the real domain).
[env.preview]
name = "gawlakfamilyfarms-preview"
[env.preview.vars]
SSO_ISSUER = "https://accounts.martingawlakcompany.com/api/auth"
SSO_CLIENT_ID = "preview-no-sign-in"
SITE_ORIGIN = "https://gawlakfamilyfarms-preview.martingawlak.workers.dev"
[env.preview.triggers]
crons = []
[[env.preview.d1_databases]]
binding = "DB"
database_name = "gawlakfamilyfarms"
database_id = "c41ec0a1-3c51-4226-bd38-6a30a8320008"
migrations_dir = "migrations"
